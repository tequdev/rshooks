[package]
name = "slot-objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
test = false

[dependencies]
rshooks = { workspace = true, features = ["host-panic-handler"] }

[dev-dependencies]
rshooks = { workspace = true, features = ["testenv"] }
rshooks-testenv.workspace = true
# Independent keylet recomputation in `tests/slot_objects.rs` (the same
# `sha512Half(ledgerSpace ++ args)` formula `examples/13_keylets` uses).
sha2 = "0.10"

[lints]
workspace = true
