[package]
name = "slot-objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# rlib lets tests/ link this crate; no_std has no test crate, see examples/README.md.
test = false

[dependencies]
rshooks = { path = "../../crates/rshooks", features = ["host-panic-handler"] }

[dev-dependencies]
rshooks = { path = "../../crates/rshooks", features = ["testenv"] }
rshooks-testenv = { path = "../../crates/rshooks-testenv" }
# Independent keylet recomputation in `tests/slot_objects.rs` (the same
# `sha512Half(ledgerSpace ++ args)` formula `examples/13_keylets` uses).
sha2 = "0.10"

[lints]
workspace = true
