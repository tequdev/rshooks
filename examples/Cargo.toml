[workspace]
resolver = "3"
members = [
    "01_accept-all",
    "02_state-counter",
    "03_hook-params",
    "04_errors",
    "05_firewall",
    "06_guard-patterns",
    "07_xfl-math",
    "08_slot-ledger",
    "09_state-foreign",
    "10_emit-txn",
    "12_typed-data",
    "13_keylets",
    "14_account-id-macro",
    "15_slot-objects",
    "16_typed-results",
    "17_sto-writer",
    "80_governance",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"

# Host `cargo check` of these no_std cdylibs (rust-analyzer) cannot use
# unwinding panics; wasm release builds abort anyway.
[profile.dev]
panic = "abort"

[profile.release]
# `opt-level = 3`, not `"z"` (see docs/DESIGN.md's §2 C6 for the full
# rationale and measurements): `reward`/`govern` originally needed a
# per-package `opt-level = 3` override to fit the Hook API's 32-level
# block/loop/if nesting limit (at `"z"`, LLVM leaves enough dead
# `HookError`-decoding/error-handling machinery in place that
# `rshooks-build`'s inlining pass doesn't fit once every function in the
# crate is inlined into `hook()`). That override is now the workspace
# default instead, because it also fixes a second, independent problem:
# `wasm32v1-none`'s LLVM backend only inlines a `[0u8; N]` zero-init as
# plain stores up to 32 bytes at `"z"`/`"s"`, falling back to a
# compiler-generated `memset` call (an unguarded loop) above that — at
# `opt-level = 3` the same threshold is 64 bytes, so any local
# zero-initialized buffer in the 33..=64 byte range (e.g. a 34-byte
# `Keylet` scratch) becomes safe by construction instead of needing
# `--auto-guard` or a hand-rolled `static` workaround. The threshold still
# exists above 64 bytes at `opt-level = 3` — it only moves, it doesn't
# disappear — so buffers larger than that (e.g. the 138-byte
# `EMIT_DETAILS_MAX_LEN`) still need the `static`/`HookStatic` idiom
# regardless of this setting. Measured impact across all 13 examples: WCE
# improved in 6, unchanged in 3, and increased only slightly (at most +12
# instructions / +7%) in the remaining 4 — no example regressed by more
# than a low double-digit instruction count. One dramatic size/WCE
# tradeoff stands out (`06_guard-patterns`, whose small `guard!`-bounded
# loops get fully unrolled: WCE -54%, size +109%) — all 13 stayed well
# within the 65,535-byte SetHook limit, and the resulting one-time
# `SetHook` fee delta is small in absolute terms even where size grew
# (see docs/DESIGN.md C6 for the full before/after table).
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
