[workspace]
resolver = "3"
members = [
    "01_accept-all",
    "02_state-counter",
    "03_hook-params",
    "04_errors",
    "05_firewall",
    "06_guard-patterns",
    "07_xfl-math",
    "08_slot-ledger",
    "09_state-foreign",
    "10_emit-txn",
    "12_typed-data",
    "13_keylets",
    "14_account-id-macro",
    "15_slot-objects",
    "16_typed-results",
    "17_sto-writer",
    "18_typed-views",
    "19_param-signature",
    "20_state-interface",
    "21_txn-template-nested",
    "22_txn-template-optional",
    "80_governance",
]

[workspace.package]
# Single source of truth for every example crate's version (each member
# inherits it via `version.workspace = true`); it tracks the root
# workspace's `[workspace.package] version`, so a release bump touches this
# one line here instead of every example manifest.
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
rshooks = { path = "../crates/rshooks" }
rshooks-testenv = { path = "../crates/rshooks-testenv" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"

# Host `cargo check` of these no_std cdylibs (rust-analyzer) cannot use
# unwinding panics; wasm release builds abort anyway.
[profile.dev]
panic = "abort"

[profile.release]
# `opt-level = 3`, not `"z"`: fits the Hook API's block/loop/if nesting
# limit after inlining and keeps zero-init buffers below the compiler's
# `memset`-libcall threshold. See docs/DESIGN.md §2 C6 for the rationale
# and before/after measurements.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
