[package]
name = "accept-all"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false

[dependencies]
# The `trace` feature turns rshooks's trace! macros into real host calls;
# without it they compile to nothing.
rshooks = { workspace = true, features = ["trace", "host-panic-handler"] }

[lints]
workspace = true
