[package]
name = "accept-all"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# This crate is no_std with no `test` crate available for wasm32v1-none;
# disable the (impossible) unit-test harness target rather than let
# `cargo test`/`--all-targets` fail trying to build one.
test = false

[dependencies]
# The `trace` feature turns rshooks's trace! macros into real host calls;
# without it they compile to nothing.
rshooks = { path = "../../crates/rshooks", features = ["trace", "host-panic-handler"] }

[lints]
workspace = true
