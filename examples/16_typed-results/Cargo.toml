[package]
name = "typed-results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# `rlib` lets the `tests/` integration tests link this crate as an ordinary
# dependency. This crate is still no_std with no `test` crate available for
# wasm32v1-none, so the lib target's own unit-test harness stays disabled
# (`test = false`) — `tests/` integration tests are a separate target and
# are unaffected by this setting.
test = false

[dependencies]
rshooks = { path = "../../crates/rshooks", features = ["host-panic-handler"] }

[dev-dependencies]
rshooks = { path = "../../crates/rshooks", features = ["testenv"] }
rshooks-testenv = { path = "../../crates/rshooks-testenv" }

[lints]
workspace = true
