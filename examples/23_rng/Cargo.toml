[package]
name = "rng"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# `rlib` lets the `tests/` integration tests link this crate as an ordinary
# dependency.

[dependencies]
rshooks = { workspace = true, features = ["host-panic-handler"] }

[dev-dependencies]
rshooks = { workspace = true, features = ["testenv"] }
rshooks-testenv.workspace = true

[lints]
workspace = true
