[package]
name = "rshooks-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND ISC"
repository.workspace = true
readme.workspace = true
description = "Build tool that turns a Rust crate into a SetHook-valid Xahau Hook WASM binary"
keywords = ["xahau", "hooks", "wasm", "cli", "build-tool"]
categories = ["development-tools::build-utils", "wasm", "cryptography::cryptocurrencies"]

[[bin]]
name = "rshooks"
path = "src/main.rs"

[lib]
name = "rshooks_build"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
wasm-opt = "=0.116.1"
wasmparser = "0.254"
wasm-encoder = { version = "0.254", features = ["wasmparser"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
wat = "1.254"
wasmi = "0.46.0"

[lints]
workspace = true
