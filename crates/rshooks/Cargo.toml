[package]
name = "rshooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Ergonomic no_std library for writing Xahau Hooks (WebAssembly smart contracts) in Rust"
keywords = ["xahau", "hooks", "smart-contracts", "wasm"]
categories = ["no-std", "wasm", "cryptography::cryptocurrencies"]

[lib]
doctest = true

[dependencies]
rshooks-core = { path = "../rshooks-core", version = "0.1.1" }
rshooks-macros = { path = "../rshooks-macros", version = "0.1.1" }

# Host-only, test-only: compiles the `tests/ui/*.rs` fixtures and diffs the
# resulting rustc output against the committed `.stderr` files, so the
# declaration macros' `compile_error!` diagnostics (which no ordinary test
# can observe — a failed compile has no test to run) stay pinned.
[dev-dependencies]
trybuild = "1"

[features]
default = ["panic-handler"]
panic-handler = []
# Provides a #[panic_handler] on non-wasm targets so host `cargo check`
# (rust-analyzer) works for no_std cdylib hook crates. Never enable this
# from a `std` context — see the handler's doc comment in lib.rs.
host-panic-handler = []
trace = []
# Amendment-availability of the generated `rshooks::views` shapes and the
# `rshooks::sfield` constants they read. Tiers live in
# `crates/rshooks-core/format_availability.json`; the two feature names are
# `xtask`'s `availability::{ACTIVE_ONLY_FEATURE, ALL_FEATURE}`.
#
#   (neither)           active + pending   <- the default
#   active-amendments   active only
#   all-amendments      active + pending + dormant
#   both                same as all-amendments (widest wins)
#
# Widest-wins is deliberate. Cargo unifies features across the whole
# dependency graph, so a crate enabling `all-amendments` turns it on for
# every other user of rshooks in that build. Making the wider feature
# dominate keeps enabling a feature additive in effect: a dependency can
# give you more API than you asked for, never take API away.

# Restrict to formats activated on Xahau mainnet. For a hook that wants its
# surface to be exactly what is live today, so a shape that has not
# activated yet cannot be reached by accident.
active-amendments = []

# Everything, including formats gated by an amendment xahaud marks
# Supported::no — they cannot appear on Xahau mainnet, where activating one
# would amendment-block the node. This feature exists for custom networks
# whose operator knows otherwise; enable it at your own judgment.
all-amendments = []
# Enables the native mock-host bridge (`rshooks_core::backend`): wrapper
# functions in `api/*` consult an installed `HostBackend` instead of the
# host stubs, and `HookStatic::take` gains a per-invocation claim path.
# Default-off; forwards to `rshooks-core/testenv`. Never enable this from a
# `wasm32` target.
testenv = ["rshooks-core/testenv"]

[lints]
workspace = true
