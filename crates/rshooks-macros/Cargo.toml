[package]
name = "rshooks-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Procedural macros for rshooks, the Xahau Hooks library"
keywords = ["xahau", "hooks", "proc-macro"]
categories = ["no-std", "development-tools"]

[lib]
proc-macro = true

[dependencies]
serde_json = "1.0"
syn = "3.0"

[features]
# Gates the Hook Parameter Signature Interface draft's macro-time surface
# (extra `ident: Type` arguments on a `#[hook(..)]` entry fn — see
# `docs/PARAM_SIGNATURE_DESIGN.md`). Enabled through rshooks's facade
# feature of the same name; not meant to be enabled directly.
unstable-param-sig-interface = []

[lints]
workspace = true
