[package]
name = "rshooks-testenv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Off-chain unit-test harness for rshooks Xahau Hooks (mock host, no wasm/node required)"
keywords = ["xahau", "hooks", "testing", "wasm"]
categories = ["development-tools::testing"]

[dependencies]
rshooks = { workspace = true, features = ["testenv"] }
rshooks-core = { workspace = true, features = ["testenv"] }
serde_json = "1.0"
sha2 = "0.10"
# util_verify (P2-C): ed25519 / secp256k1 signature verification, matching
# xahaud's own `ripple::verify` dispatch (see `src/host/util.rs`'s module
# doc comment for the exact digest-choice citation). Pure-Rust, trimmed to
# verification-only feature sets — no signing/rand dependency needed.
ed25519-dalek = { version = "2", default-features = false, features = [
    "alloc",
] }
k256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "std",
] }

[features]
unstable-param-sig-interface = ["rshooks/unstable-param-sig-interface"]
unstable-state-interface = ["rshooks/unstable-state-interface"]

[[test]]
name = "sig_params"
required-features = ["unstable-param-sig-interface"]

[[test]]
name = "state_interface"
required-features = ["unstable-state-interface"]

[lints]
workspace = true
