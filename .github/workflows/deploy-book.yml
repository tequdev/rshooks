name: Deploy Book

# Build the mdBook user guide and publish it to GitHub Pages — only when
# the book itself (or this workflow) changes on main.
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/deploy-book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-flight deploy finish so the
# published site is never left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_ARCHIVE_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          curl -sSL -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_ARCHIVE_SHA256}  mdbook.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f mdbook.tar.gz
          rm mdbook.tar.gz
          mdbook --version

      - name: Build the book
        run: mdbook build book

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
