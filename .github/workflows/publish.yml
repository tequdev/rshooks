name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Verify with cargo publish --dry-run instead of publishing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token exchange for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Multi-package `cargo publish` needs cargo >= 1.90; rust-toolchain.toml
      # pins 1.89.0, so install stable alongside it rather than bump the pin.
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # Trusted Publishing only works for crates that already exist on
      # crates.io, so the very first publish falls back to the
      # CARGO_REGISTRY_TOKEN secret; once Trusted Publishing is configured
      # for all five crates, the secret can be deleted.
      - name: Authenticate with crates.io (Trusted Publishing)
        if: ${{ !inputs.dry-run }}
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish -p rshooks-core -p rshooks-macros -p rshooks -p rshooks-build -p rshooks-testenv${{ inputs.dry-run && ' --dry-run' || '' }}

  release:
    name: Tag and create GitHub release
    needs: publish
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # All published crates share the workspace version (version.workspace
      # = true), and the repo is versioned/released as a whole, so one tag
      # covers the release. `gh release create` creates the tag itself
      # (pinned to the commit that triggered this run); safe to re-run for
      # the same commit, since an existing release is then left alone
      # instead of failing the job. If the tag exists but points at a
      # different commit, the job fails instead of silently skipping.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not determine workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_commit=$(git rev-parse "refs/tags/${tag}^{commit}")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag already exists but points at $tag_commit, not the release commit $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Release $tag already exists and matches $GITHUB_SHA, skipping"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
