name: Build examples (reusable)

# Reusable workflow: the ONE place that builds every crate under examples/
# through rshooks-build and validates the output. Called from both ci.yml
# (as its `examples` job) and e2e.yml (as its `build-hooks` job) so the
# two workflows can never drift out of sync with each other again — the
# historical failure mode here was a *step* being added to one workflow's
# hand-written per-example list and forgotten in the other's (or forgotten
# entirely for a new example). There is now only one list, and it isn't
# even hand-written: the `discover` job below derives it from
# examples/*/Cargo.toml, so adding a new example directory needs zero
# workflow edits (a per-example flag override, if the example needs one,
# is the only case that still touches this file — see the `discover` job).
#
# Jobs (all independent except `build`, which needs the other two):
#   discover           - lists examples/*/Cargo.toml and emits the build matrix
#   build-tool         - builds `rshooks-build` once (release) and shares the
#                        binary via artifact, so it isn't rebuilt per example
#   clippy             - lints the whole examples workspace once (not per-example)
#   testenv-parity     - continuous zero-wasm-impact probe (design doc §7)
#   unit-tests-examples - off-chain unit tests (rshooks-testenv harness)
#   build              - matrix job, one leg per example, fail-fast: false so one
#                        example failing never blocks the others from completing
#
# mise.toml's `build-examples` task (the local equivalent) is intentionally
# NOT generated from this same discovery logic — it's plain shell so it
# stays readable and debuggable when run by hand; keep its per-example
# invocations and comments in sync with the flag overrides declared in
# `discover` below when either changes.

on:
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Build example matrix from examples/*/Cargo.toml
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          # Per-example `rshooks build` flag overrides. This is the
          # ONLY place per-example build flags are declared for CI — add
          # one line per example that needs non-default flags (keyed by
          # its examples/ directory name) and both ci.yml and e2e.yml
          # pick it up automatically, with no further workflow edits.
          declare -A EXTRA_ARGS=(
            # [11_gas-counter]="--api-version 1"
            # 13_keylets needed --auto-guard --default-maxiter 34 before
            # this workspace's opt-level = 3 default (examples/Cargo.toml,
            # docs/DESIGN.md's §2 C6) raised the zero-init-inlining
            # threshold past Keylet's 34 bytes - no longer needed.
          )

          matrix='[]'
          for manifest in examples/*/Cargo.toml; do
            dir="$(dirname "$manifest")"
            name="$(basename "$dir")"
            args="${EXTRA_ARGS[$name]:-}"
            entry="$(jq -nc --arg name "$name" --arg dir "$dir" --arg args "$args" \
              '{name: $name, dir: $dir, args: $args}')"
            matrix="$(jq -c --argjson e "$entry" '. + [$e]' <<<"$matrix")"
          done

          echo "Discovered matrix:"
          jq . <<<"$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-tool:
    name: Build rshooks-build (shared binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build rshooks-build (release)
        run: cargo build -p rshooks-build --release

      - name: Upload rshooks-build binary
        uses: actions/upload-artifact@v7
        with:
          name: rshooks-build-bin
          path: target/release/rshooks
          if-no-files-found: error
          retention-days: 1

  clippy:
    name: Clippy (examples workspace, wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples

      - name: Clippy (examples, wasm32v1-none, deny warnings)
        # --lib instead of --all-targets: wasm32v1-none has no `test` crate,
        # so the implicit test-profile target can never build for it.
        working-directory: examples
        run: cargo clippy --workspace --lib --target wasm32v1-none -- -D warnings

  # Continuous zero-wasm-impact check (design doc
  # .claude/design/TESTENV_DESIGN.md §7): builds every example twice at
  # this same commit — as-committed vs. with all off-chain-unit-test wiring
  # mechanically stripped — and diffs every produced wasm plus its WCE/
  # size/nesting numbers. Catches any future leak of test machinery into a
  # shipped artifact; independent of the `build`/`discover` matrix above
  # (it drives `rshooks build` itself via scripts/probe-testenv-parity.sh,
  # not the shared binary those jobs upload).
  testenv-parity:
    name: Testenv parity probe (as-committed == test-wiring-stripped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build examples twice and diff wasm + WCE/size/nesting
        run: bash scripts/probe-testenv-parity.sh

  # Off-chain unit tests (rshooks-testenv harness): plain `cargo test`, no
  # wasm build, no node. Exercises both documented test layouts (see the
  # book's "Testing hooks" chapter) — 02_state-counter's tests/ integration
  # test and 10_emit-txn's in-crate #[cfg(test)] module — plus the harness
  # crate's own test suite.
  unit-tests-examples:
    name: Off-chain unit tests (rshooks-testenv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo test -p rshooks-testenv (root workspace)
        run: cargo test -p rshooks-testenv

      - name: cargo test (examples workspace, testenv-wired examples)
        run: cargo test --manifest-path examples/Cargo.toml -p state-counter -p emit-txn

  build:
    name: ${{ matrix.name }}
    needs: [discover, build-tool]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples

      - name: Download rshooks-build binary
        uses: actions/download-artifact@v7
        with:
          name: rshooks-build-bin
          path: bin

      # Building each example through rshooks-build and then `check`ing
      # every entry it declares doubles as the end-to-end test of the whole
      # toolchain (cleaner, guard pass, validator) — no_std cdylib hooks
      # have no runnable unit tests. `bin/rshooks` is the binary
      # `build-tool` built once and shared above, so it isn't recompiled
      # once per example here. A crate may declare more than one `#[hook]`
      # entry (see `80_governance`), each landing as its own
      # `<index>.<entry-fn>.wasm` under `out/current/` — check every
      # artifact the build produced rather than assuming exactly one.
      - name: Build and check
        run: |
          set -euo pipefail
          chmod +x bin/rshooks
          bin/rshooks build --manifest-path "${{ matrix.dir }}/Cargo.toml" --out "${{ matrix.dir }}/out" ${{ matrix.args }}
          for wasm in "${{ matrix.dir }}/out/current"/*.wasm; do
            bin/rshooks check "$wasm"
          done

      - name: Upload hook binary
        uses: actions/upload-artifact@v7
        with:
          name: example-hooks-${{ matrix.name }}
          path: ${{ matrix.dir }}/out/current/*.wasm
          if-no-files-found: error
