name: Build examples (reusable)

# Reusable workflow: builds every crate under examples/ through
# rshooks-build and validates the output. Called from ci.yml as its
# `examples` job, whose `e2e` job then deploys the uploaded artifacts; the
# `discover` job finds which examples are host-testable (dev-dependency on
# rshooks-testenv) for the `unit-tests-examples` job below.

on:
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      test-packages: ${{ steps.discover.outputs.test-packages }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Discover host-testable examples from examples/*/Cargo.toml
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          # Host-testable examples: crates with a dev-dependency on
          # rshooks-testenv, i.e. the ones wired up with off-chain unit
          # tests under tests/. Derived from cargo metadata instead of
          # hand-listed so a new testenv-wired example is picked up
          # without a workflow edit.
          test_packages="$(cargo metadata --manifest-path examples/Cargo.toml --format-version 1 --no-deps \
            | jq -r '[.packages[] | select(.dependencies[]? | .name == "rshooks-testenv" and .kind == "dev") | .name] | sort | join(" ")')"

          echo "Host-testable (testenv-wired) packages: $test_packages"
          echo "test-packages=$test_packages" >> "$GITHUB_OUTPUT"

  build-tool:
    name: Build rshooks-build (shared binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build rshooks-build (release)
        run: cargo build -p rshooks-build --release

      - name: Upload rshooks-build binary
        uses: actions/upload-artifact@v7
        with:
          name: rshooks-build-bin
          path: target/release/rshooks
          if-no-files-found: error
          retention-days: 1

  clippy:
    name: Clippy (examples workspace, wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples

      - name: Clippy (examples, wasm32v1-none, deny warnings)
        # --lib instead of --all-targets: wasm32v1-none has no `test` crate,
        # so the implicit test-profile target can never build for it.
        working-directory: examples
        run: cargo clippy --workspace --lib --target wasm32v1-none -- -D warnings

  # Continuous zero-wasm-impact check (design doc
  # .claude/design/TESTENV_DESIGN.md §7): builds every example twice at
  # this same commit — as-committed vs. with all off-chain-unit-test wiring
  # mechanically stripped — and diffs every produced wasm plus its WCE/
  # size/nesting numbers. Catches any future leak of test machinery into a
  # shipped artifact; independent of the `build`/`discover` matrix above
  # (it drives `rshooks build` itself via scripts/probe-testenv-parity.sh,
  # not the shared binary those jobs upload).
  testenv-parity:
    name: Testenv parity probe (as-committed == test-wiring-stripped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build examples twice and diff wasm + WCE/size/nesting
        run: bash scripts/probe-testenv-parity.sh

  # Off-chain tests for the harness and examples that opt into its host wiring.
  unit-tests-examples:
    name: Off-chain unit tests (rshooks-testenv)
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo test -p rshooks-testenv (root workspace)
        run: cargo test -p rshooks-testenv

      # ${{ needs.discover.outputs.test-packages }} is a space-separated
      # list of examples/ package names that declare a dev-dependency on
      # rshooks-testenv (see the `discover` job) - every host-testable
      # example, not a hand-picked subset.
      - name: cargo test (examples workspace, testenv-wired examples)
        run: |
          set -euo pipefail
          pkgs=(${{ needs.discover.outputs.test-packages }})
          args=()
          for pkg in "${pkgs[@]}"; do
            args+=(-p "$pkg")
          done
          cargo test --manifest-path examples/Cargo.toml "${args[@]}"

  # One job looping every example instead of one runner per example
  # (`mise run build-examples` already loops all of them; a runner per
  # example is pure spin-up overhead for a seconds-long build).
  # `continue-on-error` semantics are implemented by hand per example so
  # one broken example doesn't hide the pass/fail of the rest; the job
  # still fails overall if any example failed.
  build:
    name: Build & check examples
    needs: build-tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples

      - name: Download rshooks-build binary
        uses: actions/download-artifact@v8
        with:
          name: rshooks-build-bin
          path: bin

      # Building each example through rshooks-build and then `check`ing
      # every entry it declares doubles as the end-to-end test of the whole
      # toolchain (cleaner, guard pass, validator) — no_std cdylib hooks
      # have no runnable unit tests. `bin/rshooks` is the binary
      # `build-tool` built once and shared above, so it isn't recompiled
      # once per example here. A crate may declare more than one `#[hook]`
      # entry (see `80_governance`), each landing as its own
      # `<index>.<entry-fn>.wasm` under `out/current/` — check every
      # artifact the build produced rather than assuming exactly one.
      # examples/<dir>/metrics.json is the recorded WCE / size / nesting
      # snapshot; refresh locally with `mise run record-example-metrics`.
      - name: Build, check, and verify recorded metrics for every example
        run: |
          set -uo pipefail
          chmod +x bin/rshooks
          failed=0
          {
            echo "| Example | Build & check | Recorded metrics |"
            echo "|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          for manifest in examples/*/Cargo.toml; do
            dir="$(dirname "$manifest")"
            name="$(basename "$dir")"
            build_ok=":white_check_mark:"
            metrics_ok=":white_check_mark:"

            if bin/rshooks build --manifest-path "$manifest" --out "$dir/out"; then
              for wasm in "$dir"/out/current/*.wasm; do
                bin/rshooks check "$wasm" || build_ok=":x:"
              done
            else
              build_ok=":x:"
            fi

            if [ "$build_ok" = ":white_check_mark:" ]; then
              python3 scripts/record-example-metrics.py \
                --check --skip-build --example "$name" --rshooks bin/rshooks \
                || metrics_ok=":x:"
            else
              metrics_ok="skipped"
            fi

            [ "$build_ok" = ":x:" ] || [ "$metrics_ok" = ":x:" ] && failed=1
            echo "| $name | $build_ok | $metrics_ok |" >>"$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

      # `*.wasm` for `copy-wasm.mjs`/`readHookBinaryHexFromNS`, plus each
      # example's own `sethook.template.json` for the (growing) set of e2e
      # suites that install a hook using its generated declaration entries
      # verbatim (e.g. `e2e/test/param-signature.test.ts`) rather than
      # hand-writing them — the e2e job never runs `rshooks build`, so
      # anything it reads from `out/current/` has to come through this
      # artifact. Uploaded even if some examples failed above, so the
      # examples that did build stay inspectable.
      - name: Upload hook binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-hooks
          path: |
            examples/*/out/current/*.wasm
            examples/*/out/current/sethook.template.json
          if-no-files-found: error
