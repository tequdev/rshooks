[tools]
rust = "1.89.0"

[env]
XAHAUD_VERSION = "2026.6.21-release+3350"

[env._]
# Make the Rust proxy binaries available to mise tasks.
path = ["{{env.HOME}}/.local/share/mise/installs/rust/1.89.0"]

[tasks.fmt]
description = "Format the root workspace and the separate examples workspace"
run = """
cargo fmt --all
cargo fmt --all --manifest-path examples/Cargo.toml
"""

[tasks.lint]
description = "Lint the root workspace (all targets, plus rshooks in each amendment-availability state) and the examples workspace (wasm32v1-none), denying warnings"
run = """
cargo clippy --workspace --all-targets -- -D warnings
# Cover the active-only and widest-wins generated surfaces too.
cargo clippy -p rshooks --all-targets --features active-amendments -- -D warnings
cargo clippy -p rshooks --all-targets --all-features -- -D warnings
cargo clippy --manifest-path examples/Cargo.toml --workspace --target wasm32v1-none -- -D warnings
"""

[tasks.test]
description = "Run all workspace tests, plus rshooks in each amendment-availability state"
run = """
cargo test --workspace
# Exercise generated availability gates in every state.
cargo test -p rshooks --features active-amendments
cargo test -p rshooks --all-features
"""

[tasks."test:unstable"]
description = "Run workspace tests with unstable draft-spec features (unstable-param-sig-interface, unstable-state-interface) enabled"
run = "cargo test --workspace --features rshooks/unstable-param-sig-interface,rshooks/unstable-state-interface,rshooks-testenv/unstable-param-sig-interface,rshooks-testenv/unstable-state-interface"

[tasks.build-wasm]
description = "Build the no_std crates for the wasm32v1-none Hook target"
run = "cargo build -p rshooks-core -p rshooks --target wasm32v1-none --release"

[tasks.build-examples]
description = "Build every example through rshooks-build and check the output (end-to-end test)"
run = """
set -e

# Every single-hook example's `#[hook(0, ..)]` entry fn is named `main`, so
# each produces `0.main.wasm` under its own generation root.
for dir in \
  01_accept-all 02_state-counter 03_hook-params 04_errors 05_firewall \
  06_guard-patterns 07_xfl-math 08_slot-ledger 09_state-foreign 10_emit-txn \
  12_typed-data 13_keylets 14_account-id-macro 15_slot-objects 17_sto-writer \
  18_typed-views \
; do
  cargo run -p rshooks-build -- build --manifest-path "examples/${dir}/Cargo.toml" --out "examples/${dir}/out"
  cargo run -p rshooks-build -- check "examples/${dir}/out/current/0.main.wasm"
done

# 16_typed-results declares two hooks in one chain: `0.deposit` and
# `1.reset`.
cargo run -p rshooks-build -- build --manifest-path examples/16_typed-results/Cargo.toml --out examples/16_typed-results/out
cargo run -p rshooks-build -- check examples/16_typed-results/out/current/0.deposit.wasm
cargo run -p rshooks-build -- check examples/16_typed-results/out/current/1.reset.wasm

# 19_param-signature's `#[hook(0, ..)]` entry fn is named `increment`, not
# `main` (docs/PARAM_SIGNATURE_DESIGN.md's own worked example).
cargo run -p rshooks-build -- build --manifest-path examples/19_param-signature/Cargo.toml --out examples/19_param-signature/out
cargo run -p rshooks-build -- check examples/19_param-signature/out/current/0.increment.wasm

cargo run -p rshooks-build -- build --manifest-path examples/20_state-interface/Cargo.toml --out examples/20_state-interface/out
cargo run -p rshooks-build -- check examples/20_state-interface/out/current/0.main.wasm

# 80_governance declares two hooks in one chain: `0.govern` and `1.reward`.
cargo run -p rshooks-build -- build --manifest-path examples/80_governance/Cargo.toml --out examples/80_governance/out
cargo run -p rshooks-build -- check examples/80_governance/out/current/0.govern.wasm
cargo run -p rshooks-build -- check examples/80_governance/out/current/1.reward.wasm
"""

[tasks."record-example-metrics"]
description = "Rebuild every example and write examples/*/metrics.json (WCE / size / nesting). Pass --check to fail instead of writing; --skip-build to reuse out/current"
run = "python3 scripts/record-example-metrics.py"

[tasks."probe:testenv-parity"]
description = "Continuous zero-wasm-impact check: build every example twice (as-committed vs test-wiring stripped) and diff every wasm plus WCE/size/nesting (design doc §7)"
run = "bash scripts/probe-testenv-parity.sh"

[tasks."book:build"]
description = "Build the user guide (mdBook) into book/book"
run = "mdbook build book"

[tasks."book:serve"]
description = "Serve the user guide locally with live reload"
run = "mdbook serve book --open"

[tasks."e2e:node-up"]
description = "Start a standalone Xahau node for e2e tests (xrpld-netgen; amd64 image, runs under emulation on Apple Silicon)"
run = "xrpld-netgen up:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks."e2e:node-down"]
description = "Stop the standalone Xahau node started by e2e:node-up"
run = "xrpld-netgen down:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks.e2e]
description = "Build the examples, then run the e2e suite against a node already started with `mise run e2e:node-up`"
depends = ["build-examples"]
run = """
set -e
pnpm --dir e2e install
pnpm --dir e2e test
"""
