[tools]
rust = "1.89.0"

[env]
XAHAUD_VERSION = "2026.6.21-release+3350"

[env._]
# Make the Rust proxy binaries available to mise tasks.
path = ["{{env.HOME}}/.local/share/mise/installs/rust/1.89.0"]

[tasks.fmt]
description = "Format the root workspace and the separate examples workspace"
run = """
cargo fmt --all
cargo fmt --all --manifest-path examples/Cargo.toml
"""

[tasks.lint]
description = "Lint the root workspace (all targets, plus rshooks with all features) and the examples workspace (wasm32v1-none), denying warnings"
# `active-amendments` clippy/test runs are cut here and from `test` below
# because the feature currently gates nothing (no generated
# `not(feature = "active-amendments")` cfg exists yet); re-add both once
# the pending amendment tier is non-empty.
run = """
cargo clippy --workspace --all-targets -- -D warnings
cargo clippy -p rshooks --all-targets --all-features -- -D warnings
cargo clippy --manifest-path examples/Cargo.toml --workspace --target wasm32v1-none -- -D warnings
"""

[tasks."check-versions"]
description = "Verify every version reference tracks the root workspace version"
run = "cargo run -q -p xtask -- check-versions"

[tasks.test]
description = "Run all workspace tests, plus rshooks with all features"
run = """
cargo test --workspace
cargo test -p rshooks --all-features
"""

[tasks."test:unstable"]
description = "Run workspace tests with unstable draft-spec features (unstable-param-sig-interface, unstable-state-interface) enabled"
run = "cargo test --workspace --features rshooks/unstable-param-sig-interface,rshooks/unstable-state-interface,rshooks-testenv/unstable-param-sig-interface,rshooks-testenv/unstable-state-interface"

[tasks.build-wasm]
description = "Build the no_std crates for the wasm32v1-none Hook target"
run = "cargo build -p rshooks-core -p rshooks --target wasm32v1-none --release"

[tasks.build-examples]
description = "Build every example through rshooks-build and check the output (end-to-end test)"
run = """
set -e

for manifest in examples/*/Cargo.toml; do
  dir="$(dirname "$manifest")"
  cargo run -p rshooks-build -- build --manifest-path "$manifest" --out "$dir/out"
  for wasm in "$dir"/out/current/*.wasm; do
    cargo run -p rshooks-build -- check "$wasm"
  done
done
"""

[tasks."record-example-metrics"]
description = "Build rshooks-build fresh, rebuild every example, and write examples/*/metrics.json (WCE / size / nesting). Pass --check to fail instead of writing; --skip-build to reuse out/current; --rshooks to reuse an existing rshooks binary instead of rebuilding it"
run = "python3 scripts/record-example-metrics.py"

[tasks."probe:testenv-parity"]
description = "Continuous zero-wasm-impact check: build every example twice (as-committed vs test-wiring stripped) and diff every wasm plus WCE/size/nesting (design doc §7)"
run = "bash scripts/probe-testenv-parity.sh"

[tasks."book:build"]
description = "Build the user guide (mdBook) into book/book"
run = "mdbook build book"

[tasks."book:serve"]
description = "Serve the user guide locally with live reload"
run = "mdbook serve book --open"

[tasks."e2e:node-up"]
description = "Start a standalone Xahau node for e2e tests (xrpld-lab; amd64 image, runs under emulation on Apple Silicon)"
run = """
xrpld-lab up:standalone --protocol xahau --version $XAHAUD_VERSION
curl -fsSL -o "workspace/xahau-$XAHAUD_VERSION/xahaud.$XAHAUD_VERSION" "https://build.xahau.tech/$XAHAUD_VERSION"
chmod +x "workspace/xahau-$XAHAUD_VERSION/xahaud.$XAHAUD_VERSION"
perl -pi -e 's/"None"/""/' "workspace/xahau-$XAHAUD_VERSION/Dockerfile"
xrpld-lab up --name "xahau-$XAHAUD_VERSION"
"""

[tasks."e2e:node-down"]
description = "Stop the standalone Xahau node started by e2e:node-up"
run = "xrpld-lab down:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks.e2e]
description = "Build the examples, then run the e2e suite against a node already started with `mise run e2e:node-up`"
depends = ["build-examples"]
run = """
set -e
pnpm --dir e2e install
pnpm --dir e2e test
"""
